<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <title>ToolVerse — Không gian công cụ tổng hợp</title>
  <meta name="description" content="ToolVerse — không gian công cụ tổng hợp cho AI, tệp, Google, lập trình và kỹ thuật.">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#content">Chuyển tới nội dung chính</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Điều hướng ToolVerse">
      <div class="brand">
        <div class="brand-mark">TV</div>
        <div class="brand-copy">
          <strong>ToolVerse</strong>
          <span>Không gian công cụ tổng hợp</span>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="section-title">Không gian</div>
        <button class="nav-item active" data-route="home">
          <span class="nav-icon">⌂</span><span>Trang chủ</span>
        </button>
      </div>

      <div class="sidebar-section">
        <div class="section-title">Công cụ</div>
        <button class="nav-item" data-route="files"><span class="nav-icon">▣</span><span>Công cụ tệp</span><span class="nav-count">4</span></button>
        <button class="nav-item" data-route="google"><span class="nav-icon">G</span><span>Công cụ Google</span><span class="nav-count">1</span></button>
        <button class="nav-item" data-route="developer"><span class="nav-icon">&lt;/&gt;</span><span>Công cụ lập trình</span><span class="nav-count">4</span></button>
        <button class="nav-item" data-route="engineering"><span class="nav-icon">⌬</span><span>Công cụ kỹ thuật</span><span class="nav-count">4</span></button>
      </div>

      <div class="sidebar-bottom">
        <div class="system-card">
          <div class="system-dot"></div>
          <div>
            <strong>Hệ thống sẵn sàng</strong>
            <span>Các công cụ cục bộ đã sẵn sàng</span>
          </div>
        </div>
        <button class="collapse-btn" id="collapseBtn" title="Thu gọn sidebar">‹</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
        <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Mở menu điều hướng" aria-expanded="false">☰</button>
          <div class="topbar-context" aria-live="polite">
            <strong id="topbarTitle">ToolVerse</strong>
            <span id="topbarDescription">Không gian công cụ tổng hợp</span>
          </div>
        </div>
        <div class="top-actions">
          <label class="search">
            <span>⌕</span>
            <input id="globalSearch" type="search" placeholder="Tìm công cụ..." autocomplete="off">
          </label>
          <button class="icon-btn" id="themeBtn" type="button" title="Đổi giao diện" aria-label="Đổi màu giao diện">◐</button>
        </div>
      </header>

      <section class="content" id="content">
        <!-- Injected by app.js -->
      </section>
    </main>
  </div>

  <div class="sidebar-scrim" id="sidebarScrim" aria-hidden="true"></div>
  <div class="toast" id="toast"></div>

  <script src="./app.js"></script>
</body>
</html>
