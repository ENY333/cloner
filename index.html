<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Cloud Cloner - Cổng Bảo Mật</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #38bdf8; --card-border: rgba(255, 255, 255, 0.08); --card-bg: rgba(13, 19, 33, 0.95); --text: #f8fafc; --text-dim: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
      background: #060913; 
      color: var(--text); 
      width: 100vw;
      height: 100vh;
      overflow: hidden; 
    }
    
    #pinScreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #060913; z-index: 10000; display: flex; justify-content: center; align-items: center; }
    .pin-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 320px; max-width: 90%; }
    #pinInput { width: 100%; padding: 14px; margin-bottom: 16px; background: rgba(8, 12, 22, 0.9); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; text-align: center; letter-spacing: 4px; font-size: 16px; outline: none; }
    #pinInput:focus { border-color: var(--primary); }

    .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }

    .container { width: 100%; height: 100%; max-width: 100%; padding: 30px 4%; display: flex; flex-direction: column; }
    .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-shrink: 0; }
    .app-title { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; color: var(--primary); }
    
    .form-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); flex-shrink: 0; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
    
    input[type="text"] { width: 100%; padding: 14px 16px; background: rgba(8, 12, 22, 0.9); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    input[type="text"]:focus { border-color: var(--primary); }

    .btn-kill { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    
    .active-tasks-section { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    .section-title { font-size: 14px; font-weight: 700; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
    .tasks-scroll-container { flex-grow: 1; overflow-y: auto; padding-right: 6px; padding-bottom: 10px; }
    
    .task-item-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 14px; }
    .task-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .task-name { font-size: 14px; font-weight: 700; color: #38bdf8; font-family: 'JetBrains Mono', monospace; word-break: break-all; } 
    .task-status { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 10px; background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.2); }
    .current-file-box { background: rgba(6, 9, 19, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
    .current-file-box span { color: #e2e8f0; font-weight: 600; }
    .task-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; font-size: 13px; color: var(--text-dim); background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; text-align: center; }
    .task-metrics span { color: #fff; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>

  <!-- Màn hình nhập PIN trực tiếp trên GitHub -->
  <div id="pinScreen">
    <div class="pin-box">
      <div style="font-size: 32px; margin-bottom: 12px;">🛡️</div>
      <h2 style="color: var(--primary); margin-bottom: 20px; font-size: 18px;">HỆ THỐNG NỘI BỘ</h2>
      <input type="password" id="pinInput" placeholder="Nhập mã PIN" onkeypress="if(event.keyCode===13) checkPin()">
      <button id="btnUnlock" class="btn-submit" onclick="checkPin()">Mở Khóa</button>
    </div>
  </div>

  <!-- Giao diện chính sau khi mở khóa -->
  <div class="container" id="mainApp" style="display: none;">
    <div class="app-header">
      <div class="app-title">⚡ Drive Cloud Cloner</div>
      <button class="btn-kill" onclick="lockApp()">🚪 Đăng xuất</button>
    </div>

    <div class="form-box">
      <div class="form-group">
        <label>Link thư mục nguồn:</label>
        <input type="text" id="srcUrl" placeholder="https://drive.google.com/drive/folders/...">
      </div>
      <div class="form-group">
        <label>Link thư mục đích:</label>
        <input type="text" id="dstUrl" placeholder="https://drive.google.com/drive/folders/...">
      </div>
      <button class="btn-submit" onclick="startNewTask()">Bắt Đầu Sao Chép Nền</button>
    </div>
    <div class="active-tasks-section" id="activeTasksSection" style="display:none;">
      <div class="section-title" id="sectionTitle">Tiến trình đang chạy ngầm</div>
      <div class="tasks-scroll-container" id="tasksListContainer"></div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzJhIrQcuraszeEvQ7qGkUEB7rBMOcWil5Fg8Xf4Mgojla0fhb6-SaanaZFaSTvUCGB/exec";

    function checkPin() {
      const pin = document.getElementById('pinInput').value;
      if (pin === "5450") {
        document.getElementById('pinScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
      } else {
        alert('Mã PIN không đúng!');
      }
    }

    function lockApp() {
      document.getElementById('pinInput').value = '';
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('pinScreen').style.display = 'flex';
    }

    function startNewTask() {
      const src = document.getElementById('srcUrl').value.trim();
      const dst = document.getElementById('dstUrl').value.trim();
      if (!src || !dst) return alert('Vui lòng điền đủ 2 link!');
      alert('Đã nhận yêu cầu! (Hệ thống chạy ngầm qua GAS)');
    }
  </script>
</body>
</html>
