<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Đăng Nhập - Drive Cloner</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body, html { 
      margin: 0; padding: 0; height: 100vh; 
      background-color: #060913; 
      display: flex; justify-content: center; align-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .login-box {
      background: rgba(13, 19, 33, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      width: 320px;
    }
    .icon { font-size: 40px; margin-bottom: 15px; }
    h2 { color: #38bdf8; margin: 0 0 10px 0; font-size: 22px; font-weight: 800; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
    
    .btn-login {
      display: block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    .btn-login:hover {
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="icon">☁️</div>
    <h2>Hệ Thống Nội Bộ</h2>
    <p>Vui lòng đăng nhập đúng tài khoản chứa mã nguồn để tiếp tục.</p>
    
    <!-- Đã sửa target="_blank" thành target="_self" ở dòng dưới -->
    <a href="https://script.google.com/macros/s/AKfycbzJhIrQcuraszeEvQ7qGkUEB7rBMOcWil5Fg8Xf4Mgojla0fhb6-SaanaZFaSTvUCGB/exec" target="_self" class="btn-login">Truy cập Hệ thống</a>
  </div>

</body>
</html>
