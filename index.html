<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Tools Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 24, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #0284c7;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .wrapper {
      width: 100%;
      max-width: 580px;
    }

    /* Màn hình danh sách công cụ trang chủ */
    #home-view {
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 13.5px;
      margin-bottom: 24px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .tool-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tool-box:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }

    .tool-icon {
      font-size: 24px;
      margin-bottom: 12px;
    }

    .tool-box h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #fff;
    }

    .tool-box p {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .tool-box.add-more {
      border: 1px dashed rgba(255, 255, 255, 0.15);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    .tool-box.add-more span {
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
    }

    /* Khung hiển thị App */
    #app-container {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .app-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .app-tag {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-back:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
    }

    iframe {
      width: 100%;
      height: 480px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Giao diện Menu Trang Chủ -->
    <div id="home-view">
      <div class="badge">Workspace Portal</div>
      <h1>Trung Tâm Công Cụ</h1>
      <p class="subtitle">Chọn công cụ để thực thi trực tiếp</p>

      <div class="tools-grid">
        <div class="tool-box" onclick="launchApp('https://script.google.com/macros/s/AKfycbyDJJXCANAJEfUPgpby7TDhXcnN3YmqRJZuhXe5CLQEr_2VhAmSaArD442cDjB4IQwT/exec', '⚡ Drive Cloud Cloner')">
          <div class="tool-icon">⚡</div>
          <h3>Drive Cloud Cloner</h3>
          <p>Nhân bản thư mục Google Drive chính chủ trên Cloud.</p>
        </div>

        <div class="tool-box add-more">
          <span>+ Thêm tiện ích</span>
        </div>
      </div>
    </div>

    <!-- Khung mở App (Gọn gàng, không bị 2 lớp card) -->
    <div id="app-container">
      <div class="app-nav">
        <span class="app-tag" id="appTitle">⚡ Drive Cloud Cloner</span>
        <button class="btn-back" onclick="closeApp()">← Quay lại Menu</button>
      </div>
      <iframe id="appFrame" src="" allow="clipboard-write"></iframe>
    </div>
  </div>

  <script>
    function launchApp(url, title) {
      document.getElementById('home-view').style.display = 'none';
      document.getElementById('appTitle').innerText = title;
      document.getElementById('appFrame').src = url;
      document.getElementById('app-container').style.display = 'block';
    }

    function closeApp() {
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('appFrame').src = '';
      document.getElementById('home-view').style.display = 'block';
    }
  </script>

</body>
</html>
