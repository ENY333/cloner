<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Công Cụ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060913;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #0284c7;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Đốm sáng nền công nghệ */
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, rgba(99, 102, 241, 0.04) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Tiêu đề trang chủ */
    .portal-header {
      text-align: center;
      margin-bottom: 30px;
      transition: opacity 0.3s ease;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--accent);
      padding: 5px 14px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 13.5px;
    }

    /* Khu vực lưới công cụ */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 600px;
    }

    /* Ô nhỏ Drive Cloner */
    .tool-box {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .tool-box:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 15px 35px rgba(14, 165, 233, 0.15);
    }

    .tool-icon {
      width: 44px;
      height: 44px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .tool-info h3 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .tool-info p {
      font-size: 12.5px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    /* Ô chờ để sau này thêm tool mới */
    .tool-box.add-more {
      border: 1px dashed rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.01);
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 130px;
    }

    .tool-box.add-more:hover {
      border-color: rgba(255, 255, 255, 0.3);
      transform: none;
      box-shadow: none;
    }

    .add-more-text {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
    }

    /* Khung hiển thị App trực tiếp ngay trên trang chủ */
    #app-display-card {
      display: none;
      width: 100%;
      max-width: 650px;
      height: 620px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      animation: zoomIn 0.25s ease-out forwards;
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .app-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(11, 17, 32, 0.85);
      border-bottom: 1px solid var(--card-border);
    }

    .app-title-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: 0.2s;
    }

    .btn-close:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex-grow: 1;
      background: transparent;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="wrapper">
    <!-- Tiêu đề cổng trang chủ -->
    <div class="portal-header" id="headerSection">
      <div class="badge">Workspace</div>
      <h1>Trung Tâm Công Cụ</h1>
      <p class="subtitle">Chọn công cụ để mở trực tiếp ngay trên trang chủ</p>
    </div>

    <!-- Lưới các ô công cụ trên trang chủ -->
    <div class="tools-grid" id="toolsGrid">
      
      <!-- Ô DRIVE CLOUD CLONER -->
      <div class="tool-box" onclick="showApp('https://script.google.com/macros/s/AKfycbyDJJXCANAJEfUPgpby7TDhXcnN3YmqRJZuhXe5CLQEr_2VhAmSaArD442cDjB4IQwT/exec', '⚡ Drive Cloud Cloner')">
        <div class="tool-icon">⚡</div>
        <div class="tool-info">
          <h3>Drive Cloud Cloner</h3>
          <p>Sao chép thư mục và file Drive sang tài khoản của bạn trực tiếp trên Cloud.</p>
        </div>
      </div>

      <!-- Ô CHỜ SẴN (Sau này bạn thêm công cụ khác vào đây) -->
      <div class="tool-box add-more">
        <span class="add-more-text">+ Thêm công cụ khác</span>
      </div>

    </div>

    <!-- Khung mở công cụ Drive Cloner ngay trên nền trang chủ -->
    <div id="app-display-card">
      <div class="app-topbar">
        <div class="app-title-tag" id="appTitle">⚡ Drive Cloud Cloner</div>
        <button class="btn-close" onclick="closeApp()">✕ Đóng & Về Menu</button>
      </div>
      <iframe id="clonerFrame" src="" allow="clipboard-write"></iframe>
    </div>
  </div>

  <script>
    function showApp(url, title) {
      document.getElementById('headerSection').style.display = 'none';
      document.getElementById('toolsGrid').style.display = 'none';

      const appCard = document.getElementById('app-display-card');
      const frame = document.getElementById('clonerFrame');
      const titleTag = document.getElementById('appTitle');

      titleTag.innerText = title;
      frame.src = url;
      appCard.style.display = 'flex';
    }

    function closeApp() {
      const appCard = document.getElementById('app-display-card');
      const frame = document.getElementById('clonerFrame');

      appCard.style.display = 'none';
      frame.src = ''; // Dọn bộ nhớ

      document.getElementById('headerSection').style.display = 'block';
      document.getElementById('toolsGrid').style.display = 'grid';
    }
  </script>

</body>
</html>
