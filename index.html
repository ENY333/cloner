<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Cloud Cloner</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #38bdf8; --card-border: rgba(255, 255, 255, 0.08); --card-bg: rgba(13, 19, 33, 0.95); --text: #f8fafc; --text-dim: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
      background: #060913; 
      color: var(--text); 
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden; 
    }
    
    #pinScreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #060913; z-index: 10000; display: flex; justify-content: center; align-items: center; }
    .pin-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 320px; max-width: 90%; }
    #pinInput { width: 100%; padding: 14px; margin-bottom: 16px; background: rgba(8, 12, 22, 0.9); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; text-align: center; letter-spacing: 4px; font-size: 16px; outline: none; }
    #pinInput:focus { border-color: var(--primary); }

    .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }

    .container { width: 100%; min-height: 100vh; padding: 25px 4%; display: flex; flex-direction: column; }
    .app-header { display: flex; align-items: center; margin-bottom: 20px; }
    .app-title { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; color: var(--primary); }
    
    .form-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
    
    input[type="text"] { width: 100%; padding: 14px 16px; background: rgba(8, 12, 22, 0.9); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    input[type="text"]:focus { border-color: var(--primary); }

    .active-tasks-section { margin-top: 10px; padding-bottom: 30px; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .task-item-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    .task-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .task-name { font-size: 14px; font-weight: 700; color: #38bdf8; font-family: 'JetBrains Mono', monospace; word-break: break-all; } 
    .task-status { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 8px; background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.2); white-space: nowrap; }
    
    .current-file-box { background: rgba(6, 9, 19, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; word-break: break-all; }
    .current-file-box span { color: #e2e8f0; font-weight: 600; }

    /* ĐÃ GOM THÀNH 1 HÀNG NGANG DUY NHẤT Ở ĐÂY */
    .task-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: 11.5px; color: var(--text-dim); background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; text-align: center; }
    .task-metrics span { color: #fff; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .metric-clickable { cursor: pointer; transition: 0.2s; padding: 2px; border-radius: 4px; }
    .metric-clickable:hover { background: rgba(56, 189, 248, 0.15); color: var(--primary); }

    .btn-kill { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn-kill:hover { background: rgba(239, 68, 68, 0.3); }

    #hiddenFrame { display: none; }

    #infoModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #060913; z-index: 9999; padding: 0; margin: 0; }
    .modal-content { background: #0d1321; border: none; border-radius: 0; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 16px; color: var(--primary); }
    .modal-close { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: var(--text-dim); font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px 12px; border-radius: 6px; }
    .modal-body { padding: 20px; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; flex-grow: 1; }
    .modal-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-left: 3px solid var(--primary); border-radius: 6px; padding: 12px; margin-bottom: 10px; word-break: break-all; }
    .modal-item-name { color: #f8fafc; font-weight: 600; margin-bottom: 4px; }
    .modal-item-desc { color: var(--text-dim); font-size: 11px; }
    .empty-msg { text-align: center; color: var(--text-dim); padding: 40px; font-size: 13px; }
  </style>
</head>
<body>

  <div id="pinScreen">
    <div class="pin-box">
      <div style="font-size: 32px; margin-bottom: 12px;">🛡️</div>
      <h2 style="color: var(--primary); margin-bottom: 20px; font-size: 18px;">HỆ THỐNG NỘI BỘ</h2>
      <input type="password" id="pinInput" placeholder="Nhập mã PIN" onkeypress="if(event.keyCode===13) checkPin()">
      <button id="btnUnlock" class="btn-submit" onclick="checkPin()">Mở Khóa</button>
    </div>
  </div>

  <div class="container" id="mainApp" style="display: none;">
    <div class="app-header">
      <div class="app-title">⚡ Drive Cloud Cloner</div>
    </div>

    <div class="form-box">
      <div class="form-group">
        <label>Link thư mục nguồn:</label>
        <input type="text" id="srcUrl" placeholder="https://drive.google.com/drive/folders/...">
      </div>
      <div class="form-group">
        <label>Link thư mục đích:</label>
        <input type="text" id="dstUrl" placeholder="https://drive.google.com/drive/folders/...">
      </div>
      <button class="btn-submit" onclick="startNewTask()">Bắt Đầu Sao Chép Nền</button>
    </div>

    <div class="active-tasks-section">
      <div class="section-title" id="sectionTitle">Tiến trình đang chạy ngầm</div>
      <div id="tasksListContainer"></div>
    </div>
  </div>

  <div id="infoModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header" id="modalTitle">Chi tiết thông tin</div>
      <div class="modal-body" id="modalListContainer"></div>
    </div>
  </div>

  <iframe id="hiddenFrame" name="hiddenFrame"></iframe>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzJhIrQcuraszeEvQ7qGkUEB7rBMOcWil5Fg8Xf4Mgojla0fhb6-SaanaZFaSTvUCGB/exec";
    const CORRECT_PIN = "5450";

    function checkPin() {
      const pin = document.getElementById('pinInput').value;
      if (pin === CORRECT_PIN) {
        document.getElementById('pinScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        loadTasksStatus();
        setInterval(loadTasksStatus, 4000);
      } else {
        alert('Mã PIN không đúng!');
      }
    }

    function startNewTask() {
      const src = document.getElementById('srcUrl').value.trim();
      const dst = document.getElementById('dstUrl').value.trim();
      if (!src || !dst) return alert('Vui lòng điền đủ 2 link!');

      const form = document.createElement('form');
      form.method = 'GET';
      form.action = GAS_URL;
      form.target = 'hiddenFrame';

      const act = document.createElement('input'); act.name = 'action'; act.value = 'create'; form.appendChild(act);
      const s = document.createElement('input'); s.name = 'src'; s.value = src; form.appendChild(s);
      const d = document.createElement('input'); d.name = 'dst'; d.value = dst; form.appendChild(d);

      document.body.appendChild(form);
      form.submit();
      form.remove();

      document.getElementById('srcUrl').value = '';
      document.getElementById('dstUrl').value = '';
      setTimeout(loadTasksStatus, 1500);
    }

    let globalTasksData = [];

    function loadTasksStatus() {
      const cb = 'jsonp_' + Math.random().toString(36).substring(7);
      window[cb] = function(tasks) {
        delete window[cb];
        const container = document.getElementById('tasksListContainer');
        const titleEl = document.getElementById('sectionTitle');

        if (!tasks || tasks.length === 0) {
          titleEl.innerText = "Tiến trình đang chạy ngầm";
          container.innerHTML = '<div style="color: var(--text-dim); font-size: 12.5px;">✨ Hiện chưa có tiến trình nào đang chạy.</div>';
          return;
        }

        globalTasksData = tasks;
        let html = '';
        tasks.forEach(t => {
          let displayName = t.taskName ? t.taskName : ('Task: ' + t.id);
          html += `
            <div class="task-item-card">
              <div class="task-top">
                <div class="task-name">📂 ${displayName}</div>
                <div class="task-status">${t.statusMsg}</div>
              </div>
              <div class="current-file-box">
                Đang xử lý: <span>${t.lastFile || 'Đang kết nối...'}</span>
              </div>
              <div class="task-metrics">
                <div class="metric-clickable" onclick="openDetailModal('${t.id}', 'scanned')">Quét: <span>${t.totalScanned}</span></div>
                <div class="metric-clickable" onclick="openDetailModal('${t.id}', 'copied')">Thành công: <span>${t.copiedFiles}</span></div>
                <div class="metric-clickable" onclick="openDetailModal('${t.id}', 'queued')">Chờ 24h: <span>${t.queuedFiles}</span></div>
                <div class="metric-clickable" onclick="openDetailModal('${t.id}', 'skipped')">Bỏ qua: <span>${t.skippedFiles}</span></div>
              </div>
              <button class="btn-kill" onclick="killTask('${t.id}')">Dừng tiến trình</button>
            </div>
          `;
        });

        titleEl.innerText = `Tiến trình đang chạy ngầm (${tasks.length})`;
        container.innerHTML = html;
      };

      const s = document.createElement('script');
      s.src = GAS_URL + "?action=list&callback=" + cb;
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 5000);
    }

    function killTask(taskId) {
      const form = document.createElement('form');
      form.method = 'GET';
      form.action = GAS_URL;
      form.target = 'hiddenFrame';

      const act = document.createElement('input'); act.name = 'action'; act.value = 'kill'; form.appendChild(act);
      const id = document.createElement('input'); id.name = 'id'; id.value = taskId; form.appendChild(id);

      document.body.appendChild(form);
      form.submit();
      form.remove();
      setTimeout(loadTasksStatus, 1000);
    }

    function openDetailModal(taskId, type) {
      const task = globalTasksData.find(t => t.id === taskId);
      if (!task) return;
      let title = "Chi tiết tiến trình";
      let listData = [];

      if (type === 'scanned') { title = "📂 Tệp đã quét"; listData = task.scannedList || []; }
      else if (type === 'copied') { title = "✅ Thành công"; listData = task.copiedList || []; }
      else if (type === 'queued') { title = "⏳ Chờ 24h"; listData = task.retryQueue || []; }
      else if (type === 'skipped') { title = "🚫 Bỏ qua"; listData = task.skippedList || []; }

      document.getElementById('modalTitle').innerHTML = `<span>${title}</span><button class="modal-close" onclick="closeModal()">Đóng lại ✕</button>`;
      
      let listHtml = '';
      if (listData.length === 0) {
        listHtml = '<div class="empty-msg">✨ Chưa có dữ liệu.</div>';
      } else {
        listData.forEach(item => {
          let name = item.name || item.fileName || "Tệp ẩn danh";
          let desc = item.reason || 'Đang xử lý';
          listHtml += `
            <div class="modal-item">
              <div class="modal-item-name">📄 ${name}</div>
              <div class="modal-item-desc">Trạng thái: ${desc}</div>
            </div>
          `;
        });
      }
      document.getElementById('modalListContainer').innerHTML = listHtml;
      document.getElementById('infoModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('infoModal').style.display = 'none'; }
  </script>
</body>
</html>
